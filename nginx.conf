# Nginx config for the web container.
#
# It does two jobs:
#   /api/...  → forwarded to the tutor service (this replaces the Vite dev proxy)
#   anything else → the built static files
# Because the browser only ever talks to this one address, the app needs no CORS setup.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # "tutor" is the Kubernetes Service name (and the container name in the CI smoke test).
        proxy_pass http://tutor:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Pass the streamed answer through as it arrives instead of waiting for all of it.
        proxy_buffering off;
        # Long answers with thinking can take a while.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS file names contain a content hash, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
