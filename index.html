<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Design Lab</title>
    <meta name="description" content="Learn system design with animated diagrams, a live design simulator and an AI tutor." />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      try {
        var t = localStorage.getItem('sdl-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
